name: Daily Recruitment Update

on:
  schedule:
    # 한국시간(KST) 기준
    # 00:00, 03:00, 06:00, 09:00,
    # 12:00, 15:00, 18:00, 21:00
    #
    # GitHub Actions는 UTC 기준이므로
    # KST - 9시간으로 설정
    - cron: "0 15,18,21,0,3,6,9,12 * * *"

  # 수동 실행도 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # GitHub 저장소 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 필요한 패키지 설치
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium
          playwright install-deps chromium

      # 캘린더 스크래퍼 실행
      - name: Run calendar scraper
        run: python scrip.py

      # 채용 스크래퍼 실행
      - name: Run recruitment scraper
        run: python scrip2.py

      # 변경된 데이터 GitHub에 반영
      - name: Update website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html jobs.json

          git diff --cached --quiet || git commit -m "Update recruitment data"

          git push
