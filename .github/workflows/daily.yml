name: Daily Recruitment Update

on:
  schedule:
    # 한국시간 오전 9시
    - cron: "0 0 * * *"

    # 한국시간 오후 5시
    - cron: "0 8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run calendar scraper
        run: python scrip.py

      - name: Run recruitment scraper
        run: python scrip2.py

      - name: Update website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html jobs.json

          git diff --cached --quiet || git commit -m "Update recruitment data"

          git push
