* {

}

body {

.container {

}

.header {

}

.title {
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 8px;
}

.updated {
    color: #777;
    font-size: 13px;
}

.tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

.tab {
    border: 0;
    padding: 11px 18px;
    border-radius: 10px;
    background: white;
    color: #555;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.tab:hover {

}

.tab.active {
    color: white;
}

.tab-all.active {
    background: #374151;
}

.tab-alio.active {
    background: #16a34a;
}

.tab-saramin.active {
    background: #2563eb;
}

.tab-jobkorea.active {
    background: #f97316;
}

.summary {

    flex-wrap: wrap;
    margin-bottom: 20px;
}

.summary-card {

    border-radius: 12px;

.summary-label {

}

.summary-number {

}

.jobs {

}

.job {

}

.job:hover {
    transform: translateY(-2px);

}

.job.alio {
    border-left-color: #16a34a;
}

.job.saramin {
    border-left-color: #2563eb;
}

.job.jobkorea {
    border-left-color: #f97316;
}

.job-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.site-badge {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;

.site-alio {

}

.site-saramin {

}

.site-jobkorea {

}

.company {

    margin-bottom: 4px;
}

.job-title {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.45;
}

.deadline {
    white-space: nowrap;
    color: #dc2626;
    font-size: 12px;
    font-weight: 700;
}

.info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

.info-item {
    background: #f5f6f8;
    color: #555;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
}

.job-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
}

.reg-date {
    color: #999;
    font-size: 12px;
}

.go-link {
    color: #1967d2;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

.go-link:hover {
    text-decoration: underline;
}

.no-data {
    background: white;
    border-radius: 14px;
    padding: 50px 20px;
    text-align: center;
    color: #999;
}

@media (max-width: 700px) {

    .container {

    }

    .job {

    .job-top {
        display: block;
    }

    .deadline {
        display: block;
        margin-top: 8px;
    }

    .job-title {
        font-size: 15px;
    }

const jobsElement =
    document.getElementById("jobs");


function siteClass(site) {

    if (site === "알리오") {
        return "alio";
    }

    if (site === "사람인") {
        return "saramin";
    }

    if (site === "잡코리아") {
        return "jobkorea";
    }

    return "";
}


function siteBadgeClass(site) {

    if (site === "알리오") {
        return "site-alio";
    }

    if (site === "사람인") {
        return "site-saramin";
    }

    if (site === "잡코리아") {
        return "site-jobkorea";
    }

    return "";
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function renderJobs(list) {

    if (!list.length) {

        jobsElement.innerHTML = `
            <div class="no-data">
                해당 사이트에 오늘 등록된 공고가 없습니다.
            </div>
        `;

        return;
    }


    jobsElement.innerHTML =
        list.map(job => {

            const cls =
                siteClass(job.site);

            const badge =
                siteBadgeClass(job.site);

            return `
                <div class="job ${cls}">

                    <div class="job-top">

                        <div>

                            <div>
                                <span
                                    class="site-badge ${badge}"
                                >
                                    ${escapeHtml(job.site)}
                                </span>
                            </div>

                            <div class="company">
                                ${escapeHtml(job.company)}
                            </div>

                            <div class="job-title">
                                ${escapeHtml(job.title)}
                            </div>

                        </div>

                        <div class="deadline">
                            ${escapeHtml(job.deadline)}
                        </div>

                    </div>


                    <div class="info">

                        <span class="info-item">
                            📍 ${escapeHtml(job.location)}
                        </span>

                        <span class="info-item">
                            💼 ${escapeHtml(job.career)}
                        </span>

                        <span class="info-item">
                            🎓 ${escapeHtml(job.education)}
                        </span>

                        ${job.recruit_count
                            ? `<span class="info-item">
                                👥 ${escapeHtml(job.recruit_count)}
                               </span>`
                            : ""
                        }

                    </div>


                    <div class="job-bottom">

                        <div class="reg-date">
                            등록: ${escapeHtml(job.reg_date)}
                        </div>

                        <a
                            class="go-link"
                            href="${escapeHtml(job.link)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            공고 보기 →
                        </a>

                    </div>

                </div>
            `;

        }).join("");

}


function filterJobs(site, button) {

    document
        .querySelectorAll(".tab")
        .forEach(tab => {
            tab.classList.remove("active");
        });

    button.classList.add("active");


    if (site === "전체") {

        renderJobs(jobs);

    } else {

        renderJobs(
            jobs.filter(
                job => job.site === site
            )
        );

    }

}


renderJobs(jobs);
