const calendarElement = document.getElementById("calendar");
const detailsElement = document.getElementById("details");
const detailTitle = document.getElementById("detailTitle");
const monthTitle = document.getElementById("monthTitle");

const today = new Date();

let currentYear = today.getFullYear();
let currentMonth = today.getMonth() + 1;

let selectedDate = formatDate(
    today.getFullYear(),
    today.getMonth() + 1,
    today.getDate()
);


function formatDate(year, month, day) {
    return (
        year +
        "-" +
        String(month).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );
}


function changeMonth(amount) {
    currentMonth += amount;

    if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
    }

    if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
    }

    renderCalendar();
}


function goToday() {
    currentYear = today.getFullYear();
    currentMonth = today.getMonth() + 1;
    selectedDate = formatDate(
        today.getFullYear(),
        today.getMonth() + 1,
        today.getDate()
    );

    renderCalendar();
    showDetails(selectedDate);
}


function renderCalendar() {
    calendarElement.innerHTML = "";

    monthTitle.innerText =
        currentYear + "년 " + currentMonth + "월";

    const firstDay =
        new Date(currentYear, currentMonth - 1, 1).getDay();

    const lastDay =
        new Date(currentYear, currentMonth, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day";
        empty.style.cursor = "default";
        calendarElement.appendChild(empty);
    }

    for (let day = 1; day <= lastDay; day++) {

        const date = formatDate(
            currentYear,
            currentMonth,
            day
        );

        const cell = document.createElement("div");
        cell.className = "day";

        const dateObject =
            new Date(currentYear, currentMonth - 1, day);

        const week = dateObject.getDay();

        if (week === 0) {
            cell.classList.add("sunday");
        }

        if (week === 6) {
            cell.classList.add("saturday");
        }

        if (date === selectedDate) {
            cell.classList.add("selected");
        }

        if (date === formatDate(
            today.getFullYear(),
            today.getMonth() + 1,
            today.getDate()
        )) {
            cell.classList.add("today");
        }

        const items = recruitmentData[date] || [];

        const startCount =
            items.filter(x => x.status === "시작").length;

        const endCount =
            items.filter(x => x.status === "마감").length;

        const ongoingCount =
            items.filter(x => x.status === "수시").length;

        let content =
            '<div class="day-number">' + day + "</div>";

        content += '<div class="badges">';

        if (startCount) {
            content +=
                '<span class="badge start">🟢 시작 ' +
                startCount +
                "</span>";
        }

        if (endCount) {
            content +=
                '<span class="badge end">🔴 마감 ' +
                endCount +
                "</span>";
        }

        if (ongoingCount) {
            content +=
                '<span class="badge ongoing">🟡 수시 ' +
                ongoingCount +
                "</span>";
        }

        content += "</div>";

        cell.innerHTML = content;

        cell.addEventListener("click", function() {
            selectedDate = date;
            showDetails(date);
            renderCalendar();
        });

        calendarElement.appendChild(cell);
    }
}


function showDetails(date) {
    detailTitle.innerText =
        date + " 채용공고";

    const items =
        recruitmentData[date] || [];

    if (!items.length) {
        detailsElement.innerHTML =
            '<div class="no-data">해당 날짜의 채용공고가 없습니다.</div>';
        return;
    }

    let output = "";

    items.forEach(item => {

        let statusClass = "ongoing";

        if (item.status === "시작") {
            statusClass = "start";
        } else if (item.status === "마감") {
            statusClass = "end";
        }

        let jobsHtml = "";

        if (item.jobs && item.jobs.length) {

            item.jobs.forEach(job => {

                const applicant =
                    job.applicants === null ||
                    job.applicants === undefined
                        ? ""
                        : job.applicants + "명 작성";

                jobsHtml +=
                    '<div class="job">' +
                        '<span class="job-type">' +
                            escapeHtml(
                                job.employment_type || "-"
                            ) +
                        "</span>" +
                        "<span>" +
                            escapeHtml(job.job) +
                        "</span>" +
                        '<span class="applicants">' +
                            escapeHtml(applicant) +
                        "</span>" +
                    "</div>";
            });

        } else {
            jobsHtml =
                '<div class="no-data">모집 직무 정보 없음</div>';
        }

        output +=
            '<div class="recruit">' +

                '<div class="recruit-header">' +

                    '<div class="company">' +
                        escapeHtml(item.company) +
                    "</div>" +

                    '<div class="status ' +
                        statusClass +
                    '">' +
                        escapeHtml(item.status || "확인") +
                    "</div>" +

                "</div>" +

                '<div class="jobs">' +
                    jobsHtml +
                "</div>" +

                '<a class="link" href="' +
                    escapeAttribute(item.url) +
                    '" target="_blank" rel="noopener">' +
                    "공고 보기 →" +
                "</a>" +

            "</div>";
    });

    detailsElement.innerHTML = output;
}


function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {
    return escapeHtml(value);
}
