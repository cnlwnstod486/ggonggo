    /* =========================================================

    /* =========================================================
       푸터
    ========================================================= */

    footer {

    }

    /* =========================================================
       모바일

    @media (max-width: 760px) {

        .topbar-inner {

        .main-nav {

        }

        .nav-link {

            grid-template-columns: repeat(2, 1fr);

</style>

</header> <main class="container">
<section class="page-title">

<!-- =========================================================
     통계

<section class="stats">

    <div class="stat-card total">
        <div class="stat-label">
            전체 공고
        </div>

        <div class="stat-number" id="totalCount">

        </div>
    </div>

    <div class="stat-card alio">

    <div class="stat-card saramin">

        </div>

        <div class="stat-number" id="saraminCount">
            -
        </div>
    </div>

    <div class="stat-card jobkorea">
        <div class="stat-label">
            잡코리아
        </div>

        <div class="stat-number" id="jobkoreaCount">

        </div>

</section>

<!-- =========================================================

========================================================== -->

<section class="filter-box">

    <button

    </button>

    <button
        class="filter-btn"
        data-site="alio"
        type="button"

    </button>

    <button
        class="filter-btn"
        data-site="saramin"
        type="button"
    >
        사람인
    </button>

    <button
        class="filter-btn"
        data-site="jobkorea"
        type="button"
    >
        잡코리아
    </button>

</section>

<!-- =========================================================
     결과
========================================================== -->

<section>

    <div class="result-header">

        <div class="result-title">
            <span id="resultName">전체</span>
            공고
            <span class="result-count">
                <span id="resultCount">0</span>개
            </span>
        </div>

    </div>

    <div id="jobList" class="job-list">

        <div class="loading">
            채용공고를 불러오는 중입니다...

</main> <footer> 꽁고 채용정보 </footer> <script>
/*
 * ================================================================
 * jobs.json 불러오기
 * ================================================================
 */

let allJobs = [];
let currentSite = "all";

/*
 * ================================================================
 * HTML 특수문자 처리
 * ================================================================
 */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/*
 * ================================================================
 * 사이트 정보
 * ================================================================
 */

function getSiteInfo(job) {

    const site =
        String(job.site || "")
            .toLowerCase()
            .trim();

    if (
        site === "alio" ||
        site.includes("알리오")
    ) {

        return {
            key: "alio",
            name: "알리오"
        };

    }

    if (
        site === "saramin" ||
        site.includes("사람인")
    ) {

        return {
            key: "saramin",
            name: "사람인"
        };

    }

    if (
        site === "jobkorea" ||
        site.includes("잡코리아")
    ) {

        return {
            key: "jobkorea",
            name: "잡코리아"
        };

    }

    return {
        key: "unknown",
        name: job.site_name || "기타"
    };
}

/*
 * ================================================================
 * 숫자 표시
 * ================================================================
 */

function setCount(id, value) {

    document.getElementById(id).textContent =
        Number(value || 0).toLocaleString("ko-KR");
}

/*
 * ================================================================
 * 업데이트 시간
 * ================================================================
 */

function setUpdatedAt(data) {

    const element =
        document.getElementById("updatedAt");

    if (data.updated_at) {

        element.textContent =
            "마지막 업데이트: " +
            data.updated_at;

    } else {

        element.textContent =
            "채용공고 데이터";
    }
}

/*
 * ================================================================
 * 통계 계산
 * ================================================================
 */

function updateStats(data) {

    const counts = data.counts || {};

    let alio =
        Number(counts.alio || 0);

    let saramin =
        Number(counts.saramin || 0);

    let jobkorea =
        Number(counts.jobkorea || 0);

    /*
     * counts가 없거나 실제 jobs와 차이가 있을 경우
     * jobs 배열 기준으로 다시 계산
     */

    if (
        !alio &&
        !saramin &&
        !jobkorea &&
        Array.isArray(data.jobs)
    ) {

        alio = data.jobs.filter(
            job => getSiteInfo(job).key === "alio"
        ).length;

        saramin = data.jobs.filter(
            job => getSiteInfo(job).key === "saramin"
        ).length;

        jobkorea = data.jobs.filter(
            job => getSiteInfo(job).key === "jobkorea"
        ).length;
    }

    const total =
        Array.isArray(data.jobs)
            ? data.jobs.length
            : Number(data.total || 0);

    setCount("totalCount", total);
    setCount("alioCount", alio);
    setCount("saraminCount", saramin);
    setCount("jobkoreaCount", jobkorea);
}

/*
 * ================================================================
 * 공고 카드 생성
 * ================================================================
 */

function createJobCard(job) {

    const site =
        getSiteInfo(job);

    const company =
        job.company ||
        job.agency ||
        "회사명 없음";

    const title =
        job.title ||
        "제목 없음";

    const type =
        job.type ||
        job.employment ||
        job.employment_type ||
        "정보 없음";

    const location =
        job.location ||
        "정보 없음";

    const career =
        job.career ||
        "정보 없음";

    const education =
        job.education ||
        "정보 없음";

    const deadline =
        job.deadline ||
        "정보 없음";

    const regDate =
        job.reg_date ||
        "정보 없음";

    const link =
        job.link ||
        "#";

    return `
        <a
            class="job-card"
            href="${escapeHtml(link)}"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="job-top">

                <span class="site-badge ${site.key}">
                    ${escapeHtml(site.name)}
                </span>

                <span class="job-company">
                    ${escapeHtml(company)}
                </span>

            </div>

            <h2 class="job-title">
                ${escapeHtml(title)}
            </h2>

            <div class="job-info">

                <span class="job-info-item">
                    <span class="info-label">직종</span>
                    ${escapeHtml(type)}
                </span>

                <span class="job-info-item">
                    <span class="info-label">지역</span>
                    ${escapeHtml(location)}
                </span>

                <span class="job-info-item">
                    <span class="info-label">경력</span>
                    ${escapeHtml(career)}
                </span>

                <span class="job-info-item">
                    <span class="info-label">학력</span>
                    ${escapeHtml(education)}
                </span>

            </div>

            <div class="job-bottom">

                <div class="deadline">

                    마감
                    <strong>
                        ${escapeHtml(deadline)}
                    </strong>

                    <span style="margin-left:10px;">
                        등록 ${escapeHtml(regDate)}
                    </span>

                </div>

                <div class="go-link">
                    공고 보기 →
                </div>

            </div>

        </a>
    `;
}

/*
 * ================================================================
 * 공고 표시
 * ================================================================
 */

function renderJobs() {

    const list =
        document.getElementById("jobList");

    let filteredJobs;

    if (currentSite === "all") {

        filteredJobs = allJobs;

    } else {

        filteredJobs =
            allJobs.filter(
                job =>
                    getSiteInfo(job).key === currentSite
            );
    }

    document.getElementById("resultCount")
        .textContent =
        filteredJobs.length.toLocaleString("ko-KR");

    const names = {

        all: "전체",

        alio: "알리오",

        saramin: "사람인",

        jobkorea: "잡코리아"

    };

    document.getElementById("resultName")
        .textContent =
        names[currentSite] || "전체";

    if (!filteredJobs.length) {

        let message =
            "해당 사이트에 오늘 등록된 공고가 없습니다.";

        if (currentSite === "all") {

            message =
                "오늘 등록된 채용공고가 없습니다.";
        }

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <div class="empty-title">
                    공고가 없습니다
                </div>

                <div class="empty-text">
                    ${escapeHtml(message)}
                </div>

            </div>

        `;

        return;
    }

    list.innerHTML =
        filteredJobs
            .map(createJobCard)
            .join("");
}

/*
 * ================================================================
 * 필터 버튼
 * ================================================================
 */

function setupFilters() {

    const buttons =
        document.querySelectorAll(".filter-btn");

    buttons.forEach(button => {

        button.addEventListener(
            "click",
            () => {

                buttons.forEach(btn => {

                    btn.classList.remove(
                        "active"
                    );

                });

                button.classList.add(
                    "active"
                );

                currentSite =
                    button.dataset.site;

                renderJobs();

            }
        );

    });
}

/*
 * ================================================================
 * jobs.json 로딩
 * ================================================================
 */

async function loadJobs() {

    const list =
        document.getElementById("jobList");

    try {

        /*
         * 캐시 방지
         */

        const response =
            await fetch(
                "jobs.json?ts=" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "jobs.json HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data.jobs)) {

            throw new Error(
                "jobs.json의 jobs 데이터가 없습니다."
            );
        }

        allJobs =
            data.jobs;

        setUpdatedAt(data);

        updateStats(data);

        renderJobs();

    } catch (error) {

        console.error(
            "jobs.json 로딩 실패:",
            error
        );

        document.getElementById(
            "updatedAt"
        ).textContent =
            "채용공고 데이터를 불러오지 못했습니다.";

        list.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <div class="empty-title">
                    데이터를 불러오지 못했습니다
                </div>

                <div class="empty-text">
                    jobs.json 파일이 있는지 확인해주세요.
                </div>

            </div>

        `;
    }
}

/*
 * ================================================================
 * 시작
 * ================================================================
 */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        setupFilters();

        loadJobs();

    }
);
</script> </body> </html>
